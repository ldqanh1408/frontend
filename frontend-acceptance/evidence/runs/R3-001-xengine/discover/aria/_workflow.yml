  - heading "Create a workflow" [level=2]
  - paragraph: Task dependencies, exact saved pins and visible human checkpoints are authored here.
  - complementary:
    - heading "Task contract" [level=2]
    - paragraph: Select a task to edit its contract. No agent is assigned automatically.