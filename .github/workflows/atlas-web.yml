name: atlas-web

# Frontend quality gate for frontend/atlas-web, plus read-only acceptance of the deployed staging release.
# It never deploys and never calls the Cloudflare API: staging is checked over public HTTPS like any user.
on:
  pull_request:
    branches: [claude/sharp-thompson-5tff91, handoff/frontend-e2e]
    paths: ['frontend/atlas-web/**', '!frontend/atlas-web/docs/**', '!frontend/atlas-web/ui-review/**', '!frontend/atlas-web/HANDOFF.md', '!frontend/atlas-web/README.md', '.github/workflows/atlas-web.yml']
  push:
    branches: [claude/sharp-thompson-5tff91, handoff/frontend-e2e]
    paths: ['frontend/atlas-web/**', '!frontend/atlas-web/docs/**', '!frontend/atlas-web/ui-review/**', '!frontend/atlas-web/HANDOFF.md', '!frontend/atlas-web/README.md', '.github/workflows/atlas-web.yml']
  workflow_dispatch:
    inputs:
      check_staging:
        description: 'Run read-only staging acceptance (requires explicit request)'
        type: boolean
        default: false
      expected_release:
        description: 'Exact buildId to accept; required for staging'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: atlas-web-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: frontend/atlas-web

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/atlas-web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Typecheck
        run: npm run typecheck
      - name: Release tooling tests
        run: npm run test:tooling
      - name: Unit tests
        run: npx vitest run
      - name: Production build
        run: ATLAS_BUILD_ID=ci-${GITHUB_SHA::12} npx vite build
      - name: No fixture code in the production bundle (UXJ-28-S03)
        run: |
          if grep -RIl "Illustrative" dist/assets/*.js | xargs -r grep -l "Design review build" ; then echo "review-mode copy found in production bundle"; exit 1; fi
      - name: E2E + accessibility (local preview with production headers)
        run: npx playwright test --project=${{ matrix.engine }} --reporter=list,json
        env: { PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/e2e.json }
      - name: Canonical Linux layout and performance gates
        if: matrix.engine == 'chromium'
        run: npx playwright test --project=layout-chromium --reporter=list,json
        env: { PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/layout-perf.json }
      - name: Review-only fixtures and execution states
        run: npx vite build --mode review --outDir dist-review && npx playwright test -c playwright.review.config.ts --project=${{ matrix.engine }}
      - name: Current source release reproducibility
        if: matrix.engine == 'chromium'
        run: |
          npm run release -- ci-validation
          ID=$(node -p "require('./release/ci-validation/release-manifest.json').buildId")
          ATLAS_BUILD_ID="$ID" npx vite build
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          import { deepStrictEqual } from 'node:assert';
          import { hashFiles, sourceDigest, validateManifest } from './tools/release-manifest.mjs';
          const manifest = validateManifest(JSON.parse(readFileSync('release/ci-validation/release-manifest.json', 'utf8')));
          if (manifest.sourceCommit !== process.env.GITHUB_SHA || manifest.sourceKind !== 'git' || manifest.sourceDirty || manifest.sourceDigest !== sourceDigest(process.cwd())) throw new Error('Reproducibility must use the current clean commit.');
          deepStrictEqual(hashFiles('dist', ['/release-manifest.json']), manifest.files);
          console.log(`current source reproducible: ${manifest.fileCount}/${manifest.fileCount} files identical`);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-web-verify-${{ matrix.engine }}
          # Public repository: retain structured results without screenshots, video or trace archives.
          path: |
            frontend/atlas-web/test-results/**/*.json
            frontend/atlas-web/test-results/**/*.log
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && matrix.engine == 'chromium'
        with: { name: 'atlas-web-current-release', path: frontend/atlas-web/release/ci-validation, retention-days: 14 }

  staging:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.check_staging
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/atlas-web/package-lock.json }
      - run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium firefox webkit
      - name: Validate independent targets and requested release
        env: { EXPECTED_BUILD_ID: '${{ inputs.expected_release }}' }
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const target = JSON.parse(readFileSync('deploy/staging-target.json', 'utf8'));
          if (!target.workspaceUrl || !target.observerUrl || !process.env.EXPECTED_BUILD_ID) throw new Error('Configure workspaceUrl/observerUrl and request an exact expected_release. Legacy target metadata is not acceptance.');
          for (const [name, value] of Object.entries({ WORKSPACE_URL: target.workspaceUrl, OBSERVER_URL: target.observerUrl, EXPECTED_BUILD_ID: process.env.EXPECTED_BUILD_ID })) {
            if (/[\r\n]/.test(value)) throw new Error('Invalid staging input');
            appendFileSync(process.env.GITHUB_ENV, `${name}=${value}\n`);
          }
          JS
      - name: Read-only staging acceptance (fails on any failed gate)
        run: npm run verify:staging
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-web-staging-acceptance
          path: |
            frontend/atlas-web/test-results/**/*.json
            frontend/atlas-web/test-results/**/*.log
          retention-days: 14
