name: atlas-frontend-acceptance

# AUDIT_ONLY harness: runs read-only browser/HTTP checks against the public
# Cloudflare deployment and retains the raw results as Actions artifacts.
# It never deploys, never calls the Cloudflare API and never writes to the target.
on:
  push:
    branches: [claude/sharp-thompson-5tff91]
    paths: ['frontend-acceptance/run-request.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-frontend-acceptance
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET: https://sparkling-snow-090d.ekko-okke666.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install harness deps
        working-directory: frontend-acceptance/harness
        run: npm install --no-audit --no-fund
      - name: Install browsers
        working-directory: frontend-acceptance/harness
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Environment fingerprint
        run: |
          uname -a; nproc; free -m; node --version
          cat /etc/os-release | head -3
      - name: Run requested suites
        id: run
        env:
          MIRROR_DIR: ${{ runner.temp }}/release-mirror
        run: node frontend-acceptance/harness/run.mjs
      - name: Encrypt release mirror (repo is public)
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/release-mirror" ]; then
            OUT=frontend-acceptance/work/release-mirror.enc; mkdir -p "$OUT"
            tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/mirror.tgz" release-mirror
            openssl rand -out "$RUNNER_TEMP/k.bin" 32
            openssl enc -aes-256-cbc -pbkdf2 -salt -in "$RUNNER_TEMP/mirror.tgz" -out "$OUT/mirror.tgz.enc" -pass file:"$RUNNER_TEMP/k.bin"
            openssl pkeyutl -encrypt -pubin -inkey frontend-acceptance/harness/mirror-pubkey.pem -pkeyopt rsa_padding_mode:oaep -in "$RUNNER_TEMP/k.bin" -out "$OUT/key.bin.enc"
            sha256sum "$RUNNER_TEMP/mirror.tgz" | cut -d' ' -f1 > "$OUT/mirror.tgz.sha256"
            rm -f "$RUNNER_TEMP/k.bin"
          fi
      - name: Retain raw acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-legacy-audit-${{ github.run_id }}
          path: |
            frontend-acceptance/evidence/runs/**/*.json
            frontend-acceptance/evidence/runs/**/*.log
            frontend-acceptance/work/release-mirror.enc
          retention-days: 14
